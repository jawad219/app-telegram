<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AI Studio</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Adsgram (rewarded ads only) -->
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root{--bg:#0e1020;--card:#1a1e36;--card2:#242a52;--acc:#3b82f6;--acc2:#8b5cf6;--ok:#22c55e;--bad:#ef4444;--tx:#fff;--mut:#9aa3c7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
.page{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding:14px 14px 90px;transform:translateX(100%);visibility:hidden;transition:transform .35s cubic-bezier(.22,.8,.28,1),visibility 0s linear .35s}
.page.active{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.22,.8,.28,1),visibility 0s}
.page.under{transform:translateX(-28%)}
.splash{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.splash h1{margin:6px 0 0;font-size:28px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.splash p{color:var(--mut);margin:0}
.bar{width:160px;height:5px;background:#222849;border-radius:9px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px;animation:bar 1.1s infinite ease-in-out}
@keyframes bar{0%{margin-left:-40%}100%{margin-left:100%}}
.spin{width:90px;height:90px;border-radius:50%;border:6px solid #222849;border-top-color:var(--acc);animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hd h2{margin:0;font-size:18px;flex:1}
.bk{background:var(--card);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.bk:active{transform:scale(.88)}
.chip{background:var(--card2);padding:5px 10px;border-radius:99px;font-size:12px;white-space:nowrap}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.top .nm{flex:1;min-width:0}
.top .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .nm small{color:var(--mut)}
.ibtn{background:var(--card);border:0;color:#fff;height:40px;min-width:40px;padding:0 10px;border-radius:12px;font-size:15px;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.ibtn:active{transform:scale(.88)}
.coin{background:linear-gradient(90deg,#f59e0b,#f97316);padding:8px 12px;border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap}
.btn{display:block;width:100%;border:0;color:#fff;padding:13px;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(90deg,var(--acc),var(--acc2));margin:10px 0;transition:transform .15s cubic-bezier(.34,1.56,.64,1),opacity .2s}
.btn:active{transform:scale(.94)}
.btn:disabled{opacity:.5}
.btn.sec{background:var(--card2)}
.btn.ad{background:linear-gradient(90deg,#16a34a,#22c55e);font-size:16px;padding:15px}
.btn.bad{background:linear-gradient(90deg,#dc2626,#ef4444)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fc{background:var(--card);border-radius:18px;padding:16px 8px;text-align:center;cursor:pointer;position:relative;transition:transform .2s,box-shadow .2s;animation:pop .45s backwards;animation-delay:calc(var(--i)*35ms)}
.fc:hover{transform:translateY(-5px) scale(1.04);box-shadow:0 8px 24px rgba(59,130,246,.35)}
.fc:active{transform:scale(.94)}
.fc .ic{font-size:34px;display:block;margin-bottom:6px}
.fc b{font-size:13px;display:block}
.fc small{display:inline-block;margin-top:6px;background:var(--card2);padding:3px 9px;border-radius:99px;font-size:11px}
.fc.off{opacity:.4}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(14px)}}
.box{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.inp{width:100%;background:#12162b;border:1px solid #2a3060;color:#fff;border-radius:12px;padding:11px;font-size:14px;margin:5px 0;font-family:inherit}
textarea.inp{resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.up{display:block;text-align:center;border:2px dashed #3a4280;border-radius:14px;padding:18px;cursor:pointer;color:var(--mut);margin:6px 0}
.cv{width:100%;border-radius:12px;background:repeating-conic-gradient(#2a2f55 0 25%,#1c2040 0 50%) 50%/20px 20px;margin:8px 0;display:block}
.out{margin-top:8px}
.out img,.out video,.out audio{width:100%;border-radius:12px;display:block}
.sl{margin:8px 0;font-size:13px;color:var(--mut)}.sl span{display:flex;justify-content:space-between}.sl input{width:100%}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;background:var(--card2);color:#fff;border:0;border-radius:10px;padding:9px;cursor:pointer}.tabs button.on{background:var(--acc)}
.sk{background:linear-gradient(90deg,#1a1e36 25%,#2a3160 50%,#1a1e36 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.msg{padding:9px 12px;border-radius:14px;margin:6px 0;max-width:88%;white-space:pre-wrap;word-break:break-word;font-size:14px}
.msg.u{background:var(--acc);margin-left:auto}.msg.a{background:var(--card2)}
#chatlog{max-height:55vh;overflow-y:auto}
.hist{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid #222849;font-size:14px}
.hist small{color:var(--mut);display:block}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat div{background:var(--card);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.stat small{color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin:6px 0;line-height:1.5}
.lock{color:var(--mut);font-size:12px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(100px);background:#111633;border:1px solid #3a4280;padding:11px 16px;border-radius:14px;font-size:14px;z-index:999;transition:transform .3s;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#block{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#block h1{font-size:26px;margin:10px 0}#block p{color:var(--mut)}
</style>
</head>
<body>
<div id="pages">
  <div class="page active" id="p-splash"><div class="splash"><div id="lot" style="width:170px;height:170px"></div><h1>AI Studio</h1><p>Loading your account…</p><div class="bar"><i></i></div></div></div>
  <div class="page" id="p-home"></div>
  <div class="page" id="p-profile"></div>
  <div class="page" id="p-hist"></div>
  <div class="page" id="p-fb"></div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* ================= CONFIG — REPLACE THESE ================= */
const BOT_USERNAME   = '@Ai_Magic_Studio_bot';              // REPLACE: bot username without @
const APP_SHORT_NAME = '';                      // REPLACE: Mini App short name from BotFather (/newapp). If empty, ?start= link is used
const ADSGRAM_BLOCK_ID = 'YOUR_ADSGRAM_BLOCK_ID'; // REPLACE: Adsgram block id (rewarded)
const SUPPORT_ID     = 'ayan_coder';       // REPLACE: support username (without @)
const ADMIN_ID       = 7374675057;                       // REPLACE: YOUR_TELEGRAM_ID (number) — owner gets 999999 coins & no ads
const ADMIN_USERNAME = 'ayan_coder';                      // OPTIONAL: your username (no @) so users can send feedback/requests to you with one tap
const SIGN_SECRET    = 'nayadihahs321';    // REPLACE: any random text. MUST be same in admin.html
const YT_DL_API      = '';                      // OPTIONAL: your own downloader endpoint (returns JSON {"url":"..."}). Empty = disabled
/* ========================================================== */

const tg = window.Telegram && window.Telegram.WebApp;
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=()=>Math.floor(Math.random()*1e9);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const today=()=>new Date().toLocaleDateString('en-CA');
function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600);}
function success(){try{confetti({particleCount:110,spread:75,origin:{y:.7}});}catch(e){}try{tg.HapticFeedback.notificationOccurred('success');}catch(e){}}
function copyText(t){return (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}a.remove();}).then(()=>toast('Copied ✅'));}
function openLink(u){try{if(/^https:\/\/t\.me\//.test(u)&&tg.openTelegramLink)tg.openTelegramLink(u);else tg.openLink(u);}catch(e){window.open(u,'_blank');}}

/* ================= STATE ================= */
let DB={},P,ME,CFG,isOwner=false,BLOCKED=false,MYFP='';
const DEF_COST={1:5,2:20,3:1,4:2,5:1,6:5,7:5,8:3,9:10,10:5,11:2,12:5,13:15,14:8,15:10,16:5,17:2,18:3,19:5,20:0};
function defCfg(){const f={};for(let i=1;i<=20;i++)f[i]={cost:DEF_COST[i],on:true};return{adReward:10,dailyLimit:20,refReward:100,refDays:7,features:f,banned:[]};}
CFG=defCfg();
async function loadCfg(){try{const r=await fetch('config.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();['adReward','dailyLimit','refReward','refDays'].forEach(k=>{if(typeof j[k]==='number'&&j[k]>=0)CFG[k]=j[k];});if(Array.isArray(j.banned))CFG.banned=j.banned.map(Number);if(j.features)for(let i=1;i<=20;i++){const x=j.features[i];if(x){if(typeof x.cost==='number'&&x.cost>=0)CFG.features[i].cost=x.cost;if(typeof x.on==='boolean')CFG.features[i].on=x.on;}}}catch(e){}}

/* ================= STORAGE (CloudStorage + localStorage backup) ================= */
const hasCS=!!(tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9'));
const withTO=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
const CS={
  get(keys){return withTO(new Promise(res=>{if(!hasCS)return res({});try{tg.CloudStorage.getItems(keys,(e,v)=>res(e?{}:(v||{})));}catch(e){res({});}}),5000).then(v=>v||{});},
  set(k,v){return withTO(new Promise(res=>{if(!hasCS)return res(false);try{tg.CloudStorage.setItem(k,v,(e,ok)=>res(!e&&!!ok));}catch(e){res(false);}}),5000);}
};
const KEYS=['profile','hist','fb','req','refs','redeemed','photo'];
const LS=k=>'tm_'+ME.id+'_'+k;
const jparse=s=>{try{return JSON.parse(s);}catch(e){return null;}};
async function loadAll(){
  const cloud=await CS.get(KEYS);
  KEYS.forEach(k=>{
    const cv=cloud[k]?jparse(cloud[k]):null, lv=localStorage.getItem(LS(k))?jparse(localStorage.getItem(LS(k))):null;
    let v=cv;
    if(cv&&lv){ if(k==='profile')v=(lv.u||0)>(cv.u||0)?lv:cv; else if(Array.isArray(lv)&&Array.isArray(cv))v=lv.length>cv.length?lv:cv; }
    else if(!cv)v=lv;
    DB[k]=v;
  });
  P=DB.profile||(DB.profile={coins:0,ads:0,today:0,lastAd:'',refBy:null,refDays:[],joined:Date.now(),u:0});
  ['hist','fb','req','refs','redeemed'].forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[];});
  if(!Array.isArray(P.refDays))P.refDays=[];
}
function save(k){
  const v=DB[k];if(v==null)return;
  if(k==='profile')P.u=Date.now();
  let s=JSON.stringify(v);
  try{localStorage.setItem(LS(k),s);}catch(e){}
  if(Array.isArray(v)){const a=v.slice();while(JSON.stringify(a).length>3900&&a.length>1)a.shift();s=JSON.stringify(a);}
  if(s.length>4000)return;
  CS.set(k,s);
}

/* ================= DEVICE LOCK ================= */
async function deviceFP(){
  let id=localStorage.getItem('tm_devid');if(!id){id=Math.random().toString(36).slice(2)+Date.now().toString(36);try{localStorage.setItem('tm_devid',id);}catch(e){}}
  let gl='';try{const c=document.createElement('canvas').getContext('webgl');const e=c.getExtension('WEBGL_debug_renderer_info');gl=e?c.getParameter(e.UNMASKED_RENDERER_WEBGL):'';}catch(e){}
  const raw=[tg.platform,Math.min(screen.width,screen.height),Math.max(screen.width,screen.height),devicePixelRatio,navigator.hardwareConcurrency,navigator.deviceMemory,Intl.DateTimeFormat().resolvedOptions().timeZone,gl].join('|');
  return hash(raw)+'-'+id;
}
async function readDevice(){const c=await CS.get(['device']);return c.device?jparse(c.device):null;}
async function deviceCheck(fp){
  const cd=await readDevice(),ok='tm_owner_'+ME.id,mine=localStorage.getItem(ok);
  const claim=()=>{CS.set('device',JSON.stringify({fp,t:Date.now()}));try{localStorage.setItem(ok,fp);}catch(e){}return 'ok';};
  if(!hasCS)return 'ok';
  if(!cd)return claim();
  if(cd.fp===fp)return claim();
  if(!mine)return claim();            // brand-new device: takes over, old device gets blocked
  if(mine===cd.fp)return claim();     // same device, fingerprint drifted slightly
  return 'blocked';                   // this device was replaced by a newer one
}
async function periodic(){
  if(BLOCKED)return;
  if(hasCS){const cd=await readDevice();if(cd&&cd.fp!==MYFP){return blockScreen('Logged in on another device','This account is now active on a newer device. This device is blocked.');}}
  await loadCfg();
  if(CFG.banned.includes(ME.id))blockScreen('Account Banned','Contact support: @'+SUPPORT_ID);
}

/* ================= BLOCK SCREEN ================= */
function blockScreen(title,msg){
  BLOCKED=true;
  let d=$('#block');if(!d){d=document.createElement('div');d.id='block';document.body.appendChild(d);}
  d.innerHTML='<div style="font-size:64px">🚫</div><h1>'+esc(title)+'</h1><p>'+esc(msg||'')+'</p>';
  try{tg&&tg.BackButton.hide();}catch(e){}
}

/* ================= COINS ================= */
const coinsNow=()=>isOwner?999999:P.coins;
function renderCoins(){$$('.coins-val').forEach(e=>e.textContent=coinsNow());}
function addCoins(a,r){
  if(isOwner)return;
  if(a<0&&P.coins+a<0)a=-P.coins;
  P.coins+=a;DB.hist.push({t:Date.now(),a,r});if(DB.hist.length>300)DB.hist.shift();
  save('profile');save('hist');renderCoins();
}
function spend(a,r){
  if(isOwner||a<=0)return true;
  if(P.coins<a){toast('Not enough coins. Watch an ad to earn!');return false;}
  addCoins(-a,r);return true;
}
const fcost=id=>CFG.features[id].cost;
const charge=id=>spend(fcost(id),F.find(f=>f.id===id).n);
const refund=id=>{if(!isOwner&&fcost(id)>0)addCoins(fcost(id),'Refund: '+F.find(f=>f.id===id).n);};

/* ================= ADS ================= */
let AdC=null,adBusy=false;
function rollDay(){if(P.lastAd!==today()){P.today=0;}}
function adLabel(){rollDay();return 'Watch Ad +'+CFG.adReward+' Coins ('+P.today+'/'+CFG.dailyLimit+')';}
function setAdBtn(){const b=$('#adbtn');if(!b)return;b.disabled=adBusy;b.textContent=adBusy?'Loading ad…':adLabel();}
async function watchAd(){
  if(adBusy||isOwner||BLOCKED)return;
  rollDay();
  if(P.today>=CFG.dailyLimit)return toast('Daily limit reached ('+CFG.dailyLimit+'). Come back tomorrow!');
  if(!window.Adsgram)return toast('Ad service not loaded. Check internet.');
  try{if(!AdC)AdC=window.Adsgram.init({blockId:ADSGRAM_BLOCK_ID});}catch(e){return toast('Ad init failed');}
  adBusy=true;setAdBtn();
  try{
    const r=await AdC.show();
    if(r&&r.done){
      rollDay();
      P.ads=(P.ads||0)+1;P.today++;P.lastAd=today();
      const t=today();
      if(P.refBy&&P.refDays.length<CFG.refDays&&!P.refDays.includes(t)){P.refDays.push(t);}
      addCoins(CFG.adReward,'Rewarded ad');
      save('profile');success();toast('+'+CFG.adReward+' coins 🎉');
      if(P.refBy&&P.refDays.length>=CFG.refDays)toast('Referral goal done! Open Referral page for claim code');
    }else toast('Watch the full ad to get reward');
  }catch(r){toast((r&&r.description)||'No ad available now, try later');}
  adBusy=false;setAdBtn();
}

/* ================= CODES (referral claim / gift) ================= */
function makeCode(o){const p=btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,'');return 'TM-'+p+'.'+hash(p+SIGN_SECRET).slice(0,8);}
function parseCode(c){c=(c||'').trim();if(!c.startsWith('TM-'))return null;const [p,s]=c.slice(3).split('.');if(!p||!s||hash(p+SIGN_SECRET).slice(0,8)!==s)return null;try{return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return null;}}
function redeem(code){
  const o=parseCode(code);if(!o)return toast('Invalid code ❌');
  if(Number(o.to)!==ME.id)return toast('This code is not for your account');
  if(o.t==='rc'){
    const key='rc'+o.from;if(DB.redeemed.includes(key))return toast('Already redeemed');
    DB.redeemed.push(key);DB.refs.push({id:o.from,t:Date.now()});addCoins(CFG.refReward,'Referral reward');save('redeemed');save('refs');
    success();toast('+'+CFG.refReward+' coins referral reward 🎉');return true;
  }
  if(o.t==='gc'){
    const key='gc'+o.n;if(DB.redeemed.includes(key))return toast('Already redeemed');
    DB.redeemed.push(key);addCoins(Number(o.amt)||0,'Admin '+(o.amt>=0?'gift':'adjustment'));save('redeemed');
    success();toast((o.amt>=0?'+':'')+o.amt+' coins applied');return true;
  }
  toast('Unknown code');
}

/* ================= ROUTER ================= */
const stack=['p-splash'];
function updBack(){try{stack.length>1?tg.BackButton.show():tg.BackButton.hide();}catch(e){}}
function go(id,replace){
  if(BLOCKED)return;
  const cur=$('#'+stack[stack.length-1]),nx=$('#'+id);if(!nx||cur===nx)return;
  if(id==='p-profile')renderProfile();if(id==='p-hist')renderHist();if(id==='p-fb')renderFb();
  if(replace){$$('.page').forEach(p=>p.classList.remove('active','under'));stack.length=0;}
  else{cur.classList.remove('active');cur.classList.add('under');}
  stack.push(id);nx.classList.remove('under');nx.classList.add('active');nx.scrollTop=0;updBack();
}
function back(){
  if(stack.length<=1)return;
  const cur=stack.pop();$('#'+cur).classList.remove('active');
  const pv=$('#'+stack[stack.length-1]);pv.classList.remove('under');pv.classList.add('active');
  try{speechSynthesis.cancel();}catch(e){}
  $$('audio,video').forEach(a=>{try{a.pause();}catch(e){}});
  document.dispatchEvent(new Event('pageleave'));updBack();
}

/* ================= HELPERS ================= */
function avatarHTML(sz){
  const src=(DB.photo&&DB.photo.d)||ME.photo;
  if(src)return '<img class="av" style="width:'+sz+'px;height:'+sz+'px" src="'+esc(src)+'" onerror="this.outerHTML=\'<div class=av style=width:'+sz+'px;height:'+sz+'px>'+esc((ME.name||'?')[0]||'?')+'</div>\'">';
  return '<div class="av" style="width:'+sz+'px;height:'+sz+'px">'+esc((ME.name||'?')[0]||'?')+'</div>';
}
function loadImg(url,timeout){timeout=timeout||120000;return new Promise((res,rej)=>{
  let done=false;
  const t=setTimeout(()=>{if(!done){done=true;rej(new Error('timeout'));}},timeout);
  const attempt=cors=>{const im=new Image();if(cors)im.crossOrigin='anonymous';
    im.onload=()=>{if(done)return;done=true;clearTimeout(t);res(im);};
    im.onerror=()=>{if(done)return;if(cors)attempt(false);else{done=true;clearTimeout(t);rej(new Error('load'));}};
    im.src=url;};
  attempt(true);});}
function fileToImg(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('bad image'));im.src=u;});}
const iw=i=>i.naturalWidth||i.videoWidth||i.width,ih=i=>i.naturalHeight||i.videoHeight||i.height;
function canvasOf(img,max){const k=Math.min(1,max/Math.max(iw(img),ih(img)));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(iw(img)*k));c.height=Math.max(1,Math.round(ih(img)*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c;}

const FILTER_OK=(()=>{try{return 'filter' in document.createElement('canvas').getContext('2d');}catch(e){return false;}})();
function adjustPixels(ctx,w,h,o){
  const im=ctx.getImageData(0,0,w,h),d=im.data;
  for(let i=0;i<d.length;i+=4){
    let r=d[i]*o.b,g=d[i+1]*o.b,b=d[i+2]*o.b;
    r=(r-128)*o.c+128;g=(g-128)*o.c+128;b=(b-128)*o.c+128;
    let l=.299*r+.587*g+.114*b;r=l+(r-l)*o.s;g=l+(g-l)*o.s;b=l+(b-l)*o.s;
    if(o.gray){l=.299*r+.587*g+.114*b;r+=(l-r)*o.gray;g+=(l-g)*o.gray;b+=(l-b)*o.gray;}
    if(o.sepia){const sr=.393*r+.769*g+.189*b,sg=.349*r+.686*g+.168*b,sb=.272*r+.534*g+.131*b;r+=(sr-r)*o.sepia;g+=(sg-g)*o.sepia;b+=(sb-b)*o.sepia;}
    d[i]=r;d[i+1]=g;d[i+2]=b;
  }
  ctx.putImageData(im,0,0);
}
function drawAdj(ctx,src,w,h,o){
  o=Object.assign({b:1,c:1,s:1,gray:0,sepia:0,blur:0,hue:0},o||{});
  if(FILTER_OK){ctx.filter='brightness('+o.b+') contrast('+o.c+') saturate('+o.s+') grayscale('+o.gray+') sepia('+o.sepia+') blur('+o.blur+'px) hue-rotate('+o.hue+'deg)';ctx.drawImage(src,0,0,w,h);ctx.filter='none';}
  else{ctx.drawImage(src,0,0,w,h);if(o.b!==1||o.c!==1||o.s!==1||o.gray||o.sepia)adjustPixels(ctx,w,h,o);}
}
function sharpen(ctx,w,h,a){const s=ctx.getImageData(0,0,w,h),d=s.data,o=new Uint8ClampedArray(d);for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=(y*w+x)*4;for(let c=0;c<3;c++){const v=5*o[i+c]-o[i-4+c]-o[i+4+c]-o[i-w*4+c]-o[i+w*4+c];d[i+c]=o[i+c]+(v-o[i+c])*a;}}ctx.putImageData(s,0,0);}
function drawCover(ctx,img,W,H,zoom,px,py){const s=Math.max(W/iw(img),H/ih(img))*(zoom||1),w=iw(img)*s,h=ih(img)*s;ctx.drawImage(img,(W-w)/2+(px||0),(H-h)/2+(py||0),w,h);}
function wrapText(ctx,text,maxW){const words=String(text).split(/\s+/),lines=[];let cur='';words.forEach(w=>{const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;});if(cur)lines.push(cur);return lines;}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
async function imagesToVideo(imgs,o){
  o=Object.assign({W:720,H:1280,secPer:2.5},o||{});
  const c=document.createElement('canvas');c.width=o.W;c.height=o.H;const ctx=c.getContext('2d');
  if(!window.MediaRecorder||!c.captureStream)throw new Error('Video recording is not supported on this device');
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime)throw new Error('No supported video format');
  const rec=new MediaRecorder(c.captureStream(30),{mimeType:mime,videoBitsPerSecond:3000000}),chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  const stopped=new Promise(r=>rec.onstop=r);rec.start();
  const per=o.secPer*1000,total=imgs.length*per,t0=performance.now();
  await new Promise(res=>{(function f(){
    const t=performance.now()-t0;if(t>=total)return res();
    const idx=Math.min(imgs.length-1,Math.floor(t/per)),loc=(t%per)/per,dir=idx%2?-1:1;
    ctx.fillStyle='#000';ctx.fillRect(0,0,o.W,o.H);
    drawCover(ctx,imgs[idx],o.W,o.H,1.05+.15*(dir>0?loc:1-loc),dir*loc*20,0);
    if(loc>.85&&idx<imgs.length-1){ctx.globalAlpha=(loc-.85)/.15;drawCover(ctx,imgs[idx+1],o.W,o.H,1.05,0,0);ctx.globalAlpha=1;}
    if(o.onProgress)o.onProgress(t/total);
    requestAnimationFrame(f);})();});
  rec.stop();await stopped;
  return new Blob(chunks,{type:mime.split(';')[0]});
}
const vidExt=b=>b.type.includes('mp4')?'mp4':'webm';
function cartoonize(src,levels,edge){
  const c=canvasOf(src,1024),w=c.width,h=c.height,t=document.createElement('canvas');t.width=w;t.height=h;
  const tc=t.getContext('2d');drawAdj(tc,c,w,h,{s:1.3,blur:2});
  const im=tc.getImageData(0,0,w,h),d=im.data,g=new Float32Array(w*h);
  for(let i=0;i<w*h;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
  const step=255/(levels-1);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    const i=y*w+x,gx=-g[i-w-1]-2*g[i-1]-g[i+w-1]+g[i-w+1]+2*g[i+1]+g[i+w+1],gy=-g[i-w-1]-2*g[i-w]-g[i-w+1]+g[i+w-1]+2*g[i+w]+g[i+w+1],k=i*4;
    if(Math.hypot(gx,gy)>edge){d[k]=d[k+1]=d[k+2]=20;}
    else{d[k]=Math.round(d[k]/step)*step;d[k+1]=Math.round(d[k+1]/step)*step;d[k+2]=Math.round(d[k+2]/step)*step;}
  }
  tc.putImageData(im,0,0);return t;
}

  f.innerHTML='<div class="hd"><button class="bk" data-back>←</button><h2>💬 Feedback</h2></div><div class="box"><textarea id="ft" class="inp" rows="5" maxlength="300" placeholder="Tell us what to improve… (max 300 chars)"></textarea><button class="btn" id="fs">Submit</button><p class="note">Saved in your account storage'+(ADMIN_USERNAME?'; after saving you can also send it to the admin with one tap.':'.')+'</p></div>'+
  (DB.fb.length?'<div class="box"><b>Your previous feedback</b>'+DB.fb.slice().reverse().slice(0,10).map(x=>'<div class="hist"><div>'+esc(x.m)+'<small>'+new Date(x.t).toLocaleString()+'</small></div></div>').join('')+'</div>':'');
  $('#fs',f).onclick=()=>{const m=$('#ft',f).value.trim().slice(0,300);if(m.length<3)return toast('Write a bit more');
    const r={t:Date.now(),m};DB.fb.push(r);save('fb');toast('Feedback saved ✅');
    if(ADMIN_USERNAME)openLink('https://t.me/'+ADMIN_USERNAME+'?text='+encodeURIComponent('TMAPP:'+JSON.stringify({k:'fb',id:ME.id,n:ME.name,t:m,ts:r.t})));
    renderFb();};
}

    lottie.loadAnimation({container:el,renderer:'svg',loop:true,autoplay:true,animationData:{v:'5.7.0',fr:30,ip:0,op:60,w:200,h:200,nm:'pulse',ddd:0,assets:[],layers:[{ddd:0,ind:1,ty:4,nm:'c',sr:1,ks:{o:{a:0,k:100},r:{a:0,k:0},p:{a:0,k:[100,100,0]},a:{a:0,k:[0,0,0]},s:{a:1,k:[kf([60,60,100],[100,100,100],0),kf([100,100,100],[60,60,100],30),{t:60,s:[60,60,100]}]}},ao:0,shapes:[{ty:'gr',it:[{ty:'el',p:{a:0,k:[0,0]},s:{a:0,k:[120,120]},nm:'e'},{ty:'fl',c:{a:0,k:[.23,.51,.96,1]},o:{a:0,k:100},r:1,nm:'f'},{ty:'tr',p:{a:0,k:[0,0]},a:{a:0,k:[0,0]},s:{a:0,k:[100,100]},r:{a:0,k:0},o:{a:0,k:100},sk:{a:0,k:0},sa:{a:0,k:0}}],nm:'g'}],ip:0,op:60,st:0,bounds:{}}]}});
  }catch(e){el.innerHTML='<div class="spin" style="margin:40px auto"></div>';}

/* ================= BOOT ================= */
async function boot(){
  if(!tg||!tg.initData)return blockScreen('Please Open Inside Telegram Bot @'+BOT_USERNAME,'This app only works inside Telegram.');
  try{tg.ready();tg.expand();tg.setHeaderColor('#0e1020');tg.setBackgroundColor('#0e1020');if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();}catch(e){}
  const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;
  if(!u||!u.id)return blockScreen('Please Open Inside Telegram Bot @'+BOT_USERNAME,'This app only works inside Telegram.');
  initLottie();
  ME={id:u.id,name:((u.first_name||'')+' '+(u.last_name||'')).trim()||'User',username:u.username||'',photo:u.photo_url||''};
  isOwner=!!ADMIN_ID&&ME.id===ADMIN_ID;
  const t0=Date.now();
  await loadCfg();
  if(CFG.banned.includes(ME.id))return blockScreen('Account Banned','Contact support: @'+SUPPORT_ID);
  await loadAll();
  MYFP=await deviceFP();
  if(await deviceCheck(MYFP)==='blocked')return blockScreen('Logged in on another device','This account is active on a newer device. This device is blocked.');
  P.name=ME.name;P.username=ME.username;                // auto-sync Telegram name/username
  const m=/^REF_(\d+)$/.exec((tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||'');
  if(m&&!P.refBy&&Number(m[1])!==ME.id&&Date.now()-P.joined<172800000)P.refBy=Number(m[1]);
  save('profile');
  buildPages();renderHome();
  document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-back]'))back();});
  try{tg.BackButton.onClick(back);}catch(e){}
  if(!hasCS)setTimeout(()=>toast('Cloud storage unavailable — using local backup only'),2200);
  await sleep(Math.max(0,1500-(Date.now()-t0)));
  go('p-home',true);
  setInterval(periodic,45000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)periodic();});
}
boot();
</script>
