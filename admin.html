<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Admin Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e1020;--card:#1a1e36;--card2:#242a52;--acc:#3b82f6;--acc2:#8b5cf6;--ok:#22c55e;--bad:#ef4444;--mut:#9aa3c7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:14px 14px 80px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
.tabs button{flex:none;background:var(--card2);color:#fff;border:0;border-radius:10px;padding:9px 13px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--acc)}
.box{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.inp{width:100%;background:#12162b;border:1px solid #2a3060;color:#fff;border-radius:12px;padding:11px;font-size:14px;margin:5px 0;font-family:inherit}
.btn{display:block;width:100%;border:0;color:#fff;padding:12px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;background:linear-gradient(90deg,var(--acc),var(--acc2));margin:8px 0;transition:transform .15s}
.btn:active{transform:scale(.94)}.btn.sec{background:var(--card2)}.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat div{background:var(--card);border-radius:14px;padding:14px;text-align:center}.stat b{display:block;font-size:24px}.stat small{color:var(--mut)}
.note{font-size:12px;color:var(--mut);line-height:1.5;margin:6px 0}
.item{padding:10px 0;border-bottom:1px solid #222849;font-size:14px;word-break:break-word}.item small{color:var(--mut);display:block}
.fr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #222849;font-size:13px}.fr span{flex:1}.fr input[type=number]{width:70px;margin:0;padding:8px}
.sw{position:relative;width:46px;height:26px;flex:none}.sw input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:2}.sw i{position:absolute;inset:0;background:#3a3f66;border-radius:99px;transition:.2s}.sw i:before{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+i{background:var(--ok)}.sw input:checked+i:before{transform:translateX(20px)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(100px);background:#111633;border:1px solid #3a4280;padding:11px 16px;border-radius:14px;font-size:14px;z-index:99;transition:transform .3s}
#toast.show{transform:translateX(-50%) translateY(0)}
#deny{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:999}
textarea.inp{resize:vertical}
</style>
</head>
<body>
<div id="app" style="display:none">
  <h1>🛠 Admin Panel</h1>
  <div class="note">👑 Owner: unlimited coins (999999) and no ads in the main app.</div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* ====== CONFIG — REPLACE ====== */
const ADMIN_ID    = 0;                    // REPLACE: YOUR_TELEGRAM_ID (number)
const SIGN_SECRET = 'change-this-secret'; // REPLACE: must be IDENTICAL to index.html
/* ============================== */
const tg=window.Telegram&&window.Telegram.WebApp;
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2400);}
function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);}
function makeCode(o){const p=btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,'');return 'TM-'+p+'.'+hash(p+SIGN_SECRET).slice(0,8);}
function copyText(t){return(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}a.remove();}).then(()=>toast('Copied ✅'));}
function deny(title,msg){document.body.innerHTML='<div id="deny"><div style="font-size:60px">🚫</div><h1>'+esc(title)+'</h1><p style="color:#9aa3c7">'+esc(msg||'')+'</p></div>';}

const FN=['AI Image','AI Video','Chat Free','Voice to Text','Text to Voice','YT to Text','YT Downloader','Photo Enhancer','Video Enhancer','BG Remover','Image Editor','Cartoon Photo','Cartoon Video','Avatar / Face Swap','AI Music','Logo Maker','Caption / Hashtag','Story Writer','YT Thumbnail','Referral'];
const DEF_COST=[5,20,1,2,1,5,5,3,10,5,2,5,15,8,10,5,2,3,5,0];

/* ---- storage: Telegram CloudStorage (chunked) + localStorage backup ---- */
const hasCS=!!(tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9'));
const withTO=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
const csGet=keys=>withTO(new Promise(res=>{if(!hasCS)return res({});try{tg.CloudStorage.getItems(keys,(e,v)=>res(e?{}:(v||{})));}catch(e){res({});}}),5000).then(v=>v||{});
const csSet=(k,v)=>withTO(new Promise(res=>{if(!hasCS)return res(false);try{tg.CloudStorage.setItem(k,v,(e,ok)=>res(!e&&!!ok));}catch(e){res(false);}}),5000);
const parse=s=>{try{return JSON.parse(s);}catch(e){return null;}};
async function putBig(name,arr){
  try{localStorage.setItem('adm_'+name,JSON.stringify(arr));}catch(e){}
  const chunks=[];let cur=[];arr.forEach(x=>{cur.push(x);if(JSON.stringify(cur).length>3300){const last=cur.pop();chunks.push(cur);cur=[last];}});if(cur.length||!chunks.length)chunks.push(cur);
  const old=parseInt((await csGet([name+'_n']))[name+'_n']||'0',10);
  for(let i=0;i<chunks.length;i++)await csSet(name+'_'+i,JSON.stringify(chunks[i]));
  for(let i=chunks.length;i<old;i++)await csSet(name+'_'+i,'[]');
  await csSet(name+'_n',String(chunks.length));
}
async function getBig(name){
  const ls=parse(localStorage.getItem('adm_'+name)||'null');if(Array.isArray(ls))return ls;
  const n=parseInt((await csGet([name+'_n']))[name+'_n']||'0',10);if(!n)return[];
  const keys=[];for(let i=0;i<n;i++)keys.push(name+'_'+i);const d=await csGet(keys);let out=[];keys.forEach(k=>{const a=parse(d[k]||'[]');if(Array.isArray(a))out=out.concat(a);});return out;
}
async function putObj(name,o){const s=JSON.stringify(o);try{localStorage.setItem('adm_'+name,s);}catch(e){}if(s.length<=4000)await csSet(name,s);}
async function getObj(name){const l=parse(localStorage.getItem('adm_'+name)||'null');if(l)return l;const c=await csGet([name]);return c[name]?parse(c[name]):null;}

let CFG,BANNED=[],INBOX=[],SEEN=[],tab='dash';
function defCfg(){const f={};for(let i=1;i<=20;i++)f[i]={cost:DEF_COST[i-1],on:true};return{adReward:10,dailyLimit:20,refReward:100,refDays:7,features:f};}
async function load(){
  const c=await getObj('cfg');CFG=defCfg();
  if(c){['adReward','dailyLimit','refReward','refDays'].forEach(k=>{if(typeof c[k]==='number')CFG[k]=c[k];});if(c.features)for(let i=1;i<=20;i++)if(c.features[i])CFG.features[i]=Object.assign(CFG.features[i],c.features[i]);}
  BANNED=(await getBig('banned')).map(Number);INBOX=await getBig('inbox');SEEN=(await getBig('seen')).map(Number);
}
const saveCfg=()=>putObj('cfg',CFG).then(()=>toast('Saved ✅'));
const saveBanned=()=>putBig('banned',BANNED);
const saveInbox=()=>putBig('inbox',INBOX);
const saveSeen=()=>putBig('seen',SEEN);
function exportJSON(){return JSON.stringify(Object.assign({},CFG,{banned:BANNED}),null,2);}

const TABS=[['dash','📊 Dashboard'],['users','👥 Users'],['ads','📺 Ads'],['feat','🧩 Features'],['ref','🎁 Referral'],['inbox','📥 Inbox'],['pub','🚀 Publish']];
function drawTabs(){$('#tabs').innerHTML=TABS.map(t=>'<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>').join('');document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});}
function uniqUsers(){const s=new Set(SEEN);INBOX.forEach(x=>x.id&&s.add(Number(x.id)));return s;}

function render(){
  drawTabs();const v=$('#view');
  if(tab==='dash'){
    const fb=INBOX.filter(x=>x.k==='fb').length,dl=INBOX.filter(x=>x.k==='del').length;
    v.innerHTML='<div class="stat"><div><b>'+uniqUsers().size+'</b><small>Known users</small></div><div><b>'+BANNED.length+'</b><small>Banned</small></div><div><b>'+fb+'</b><small>Feedbacks</small></div><div><b>'+dl+'</b><small>Deletion requests</small></div></div>'+
    '<div class="box" style="margin-top:12px"><b>Current settings</b><p class="note">Ad reward: '+CFG.adReward+' coins · Daily limit: '+CFG.dailyLimit+' ads · Referral reward: '+CFG.refReward+' coins</p></div>'+
    '<p class="note">⚠ Telegram CloudStorage is private per user, so this panel can only see data that reaches you through the <b>Inbox</b> (feedback / deletion messages users send you) and IDs you search. Total ads watched across all users is not available without a server.</p>';
  }
  else if(tab==='users'){
    v.innerHTML='<div class="box"><h2>Search user by ID</h2><input class="inp" id="uid" inputmode="numeric" placeholder="Telegram ID"><button class="btn" id="sr">Search</button><div id="ur"></div></div>';
    $('#sr').onclick=()=>{
      const id=parseInt($('#uid').value,10);if(!id)return toast('Enter a numeric ID');
      if(!SEEN.includes(id)){SEEN.push(id);saveSeen();}
      const banned=BANNED.includes(id),items=INBOX.filter(x=>Number(x.id)===id);
      $('#ur').innerHTML='<div class="item"><b>ID '+id+'</b> '+(banned?'<span style="color:#ef4444">● BANNED</span>':'<span style="color:#22c55e">● active</span>')+'<small>'+(items[0]&&items[0].n?esc(items[0].n)+' · ':'')+items.length+' message(s) in inbox</small></div>'+
      '<button class="btn '+(banned?'ok':'bad')+'" id="bn">'+(banned?'Unban':'Ban')+'</button><input class="inp" id="am" type="number" placeholder="Coins amount (e.g. 50)"><div class="row"><button class="btn ok" id="ad">➕ Add coins</button><button class="btn bad" id="rm">➖ Remove coins</button></div><div id="gc"></div>'+
      '<p class="note">Ban takes effect after you publish config (🚀 Publish tab). Coin changes are delivered as a signed gift code the user redeems in the app (Referral page → Redeem).</p>';
      $('#bn').onclick=async()=>{if(banned)BANNED=BANNED.filter(x=>x!==id);else BANNED.push(id);await saveBanned();toast(banned?'Unbanned':'Banned');$('#sr').onclick();};
      const mk=sign=>{const a=Math.abs(parseInt($('#am').value,10));if(!a)return toast('Enter amount');const c=makeCode({t:'gc',to:id,amt:sign*a,n:Date.now().toString(36)+Math.random().toString(36).slice(2,6)});
        $('#gc').innerHTML='<div class="note">Gift code ('+(sign>0?'+':'-')+a+' coins) — send it to the user:</div><textarea class="inp" rows="3" readonly id="gct">'+esc(c)+'</textarea><div class="row"><button class="btn sec" id="gcc">Copy</button><button class="btn" id="gcs">Share</button></div>';
        $('#gcc').onclick=()=>copyText(c);$('#gcs').onclick=()=>{const u='https://t.me/share/url?url=&text='+encodeURIComponent(c);try{tg.openTelegramLink(u);}catch(e){window.open(u);}};};
      $('#ad').onclick=()=>mk(1);$('#rm').onclick=()=>mk(-1);
    };
  }
  else if(tab==='ads'){
    v.innerHTML='<div class="box"><h2>Ads control</h2><label class="note">Reward coins per ad</label><input class="inp" id="a1" type="number" min="0" value="'+CFG.adReward+'"><label class="note">Max ads per day per user</label><input class="inp" id="a2" type="number" min="1" value="'+CFG.dailyLimit+'"><button class="btn" id="sv">Save</button><p class="note">Publish config afterwards so users get the new values.</p></div>';
    $('#sv').onclick=()=>{CFG.adReward=Math.max(0,parseInt($('#a1').value,10)||0);CFG.dailyLimit=Math.max(1,parseInt($('#a2').value,10)||1);saveCfg();};
  }
  else if(tab==='feat'){
    v.innerHTML='<div class="box"><h2>Feature control</h2>'+FN.map((n,i)=>'<div class="fr"><span>'+(i+1)+'. '+esc(n)+'</span><input class="inp" type="number" min="0" data-c="'+(i+1)+'" value="'+CFG.features[i+1].cost+'"><label class="sw"><input type="checkbox" data-o="'+(i+1)+'" '+(CFG.features[i+1].on?'checked':'')+'><i></i></label></div>').join('')+'<button class="btn" id="sv">Save</button></div>';
    $('#sv').onclick=()=>{document.querySelectorAll('[data-c]').forEach(e=>CFG.features[e.dataset.c].cost=Math.max(0,parseInt(e.value,10)||0));document.querySelectorAll('[data-o]').forEach(e=>CFG.features[e.dataset.o].on=e.checked);saveCfg();};
  }
  else if(tab==='ref'){
    v.innerHTML='<div class="box"><h2>Referral control</h2><label class="note">Reward coins for referrer</label><input class="inp" id="r1" type="number" min="0" value="'+CFG.refReward+'"><label class="note">Ad-days required from referred user</label><input class="inp" id="r2" type="number" min="1" value="'+CFG.refDays+'"><button class="btn" id="sv">Save</button></div>';
    $('#sv').onclick=()=>{CFG.refReward=Math.max(0,parseInt($('#r1').value,10)||0);CFG.refDays=Math.max(1,parseInt($('#r2').value,10)||1);saveCfg();};
  }
  else if(tab==='inbox'){
    v.innerHTML='<div class="box"><h2>Import messages</h2><p class="note">Users send feedback / deletion requests to you as a chat message starting with <b>TMAPP:</b>. Paste those messages here (one per line).</p><textarea class="inp" rows="4" id="imp" placeholder="TMAPP:{...}"></textarea><button class="btn" id="im">Import</button></div><div class="box"><h2>Feedbacks & Deletion requests</h2><div id="list"></div></div>';
    const list=()=>{const L=INBOX.slice().reverse();$('#list').innerHTML=L.length?L.map(x=>'<div class="item"><b>'+(x.k==='del'?'🗑 Deletion request':'💬 Feedback')+'</b> · '+esc(x.n||'')+' (ID '+esc(x.id)+')<small>'+new Date(x.ts||Date.now()).toLocaleString()+'</small>'+(x.t?'<div>'+esc(x.t)+'</div>':'')+'<div class="row"><button class="btn sec" data-d="'+x.ts+'_'+x.id+'">✔ Resolve</button>'+(x.k==='del'?'<button class="btn bad" data-b="'+x.id+'">Ban</button>':'')+'</div></div>').join(''):'<p class="note">Nothing yet.</p>';
      document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{INBOX=INBOX.filter(x=>(x.ts+'_'+x.id)!==b.dataset.d);await saveInbox();render();});
      document.querySelectorAll('[data-b]').forEach(b=>b.onclick=async()=>{const id=Number(b.dataset.b);if(!BANNED.includes(id))BANNED.push(id);await saveBanned();toast('Banned (publish config to apply)');});};
    list();
    $('#im').onclick=async()=>{let n=0;$('#imp').value.split('\n').forEach(l=>{const i=l.indexOf('TMAPP:');if(i<0)return;const o=parse(l.slice(i+6).trim());if(!o||!o.id||!['fb','del'].includes(o.k))return;
      if(INBOX.some(x=>x.ts===o.ts&&String(x.id)===String(o.id)))return;INBOX.push({k:o.k,id:o.id,n:String(o.n||'').slice(0,60),t:String(o.t||'').slice(0,300),ts:o.ts||Date.now()});n++;});
      if(n){await saveInbox();toast(n+' imported');render();}else toast('No new valid messages');};
  }
  else if(tab==='pub'){
    v.innerHTML='<div class="box"><h2>Publish config to users</h2><p class="note">Users read <b>config.json</b> from your GitHub Pages site (same folder as index.html). Copy the JSON below, create/replace <b>config.json</b> in your repo and commit. Settings, feature costs/ON-OFF and bans go live within seconds.</p><textarea class="inp" rows="14" readonly id="cj">'+esc(exportJSON())+'</textarea><div class="row"><button class="btn" id="cp">Copy JSON</button><button class="btn sec" id="dl">Download</button></div></div>';
    $('#cp').onclick=()=>copyText(exportJSON());
    $('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([exportJSON()],{type:'application/json'}));a.download='config.json';a.click();};
  }
}

(async function init(){
  if(!tg||!tg.initData)return deny('Please Open Inside Telegram','Admin panel works only inside Telegram.');
  const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;
  if(!u||!ADMIN_ID||u.id!==ADMIN_ID)return deny('Access Denied','You are not allowed to open this page.');
  try{tg.ready();tg.expand();tg.setHeaderColor('#0e1020');tg.setBackgroundColor('#0e1020');}catch(e){}
  await load();$('#app').style.display='block';render();
})();
</script>
</body>
</html>
